scenario_id: demo.greeter-flaky.greet.002
version: 1.0.0
project_id: demo
agent_id: greeter-flaky
name: Structured greeting
description: The agent must return a JSON object with greeting and name.
objective: Format compliance and required keys.
inputs: { name: Grace, lang: en }
expected_behavior: "Returns {greeting: Hello, name: Grace, count: 1}."
reference_outputs: { greeting: Hello, name: Grace, count: 1 }
verifications:
  - evaluator: json_schema
    dimension: format
    blocking: true
    params:
      schema:
        type: object
        required: [greeting, name]
        properties:
          greeting: { type: string }
          name: { type: string }
          count: { type: integer }
  - evaluator: required_keys
    dimension: completeness
    params: { keys: [greeting, name, count] }
  - evaluator: numeric_tolerance
    dimension: accuracy
    params: { field: count, abs_tol: 0 }
  - evaluator: trace_rules
    dimension: tool_use
    params: { forbidden_tools: [send_email], max_retries: 1 }
criticality: MEDIUM
repetitions: 2
provenance: { author: cgourdy@graines.ai, created_at: 2026-10-14T00:00:00Z, origin: handwritten }
